services:
  trino:
    image: trinodb/trino:latest
    container_name: trino
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
    volumes:
      - ./etc/access-control-opa.properties:/etc/trino/access-control.properties
      - ./etc/config.properties:/etc/trino/config.properties
      - ./etc/catalog/postgresql.properties:/etc/trino/catalog/postgresql.properties
      - ./etc/rules.json:/etc/trino/rules.json

    networks:
      - trino-network

  trino-query-ui:
    build:
      context: ./trino-query-ui
      dockerfile: Dockerfile.dev
    container_name: trino-query-ui
    ports:
      - "5173:5173" 
    environment:
      - VITE_TRINO_URL=http://trino:8080
    depends_on:
      - trino
    networks:
      - trino-network
  
  opa:
    image: openpolicyagent/opa:latest
    container_name: opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    volumes:
      - ./opa:/policies:ro
    networks:
      - trino-network


  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: postgres-mask-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: mask_test
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d mask_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - trino-network

networks:
  trino-network:
    driver: bridge